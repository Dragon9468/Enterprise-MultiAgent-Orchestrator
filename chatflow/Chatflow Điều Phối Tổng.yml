      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      config:
        inputs_config:
          enabled: true
          preset_response: ⚠️ Yêu cầu của bạn chứa từ khóa bị hạn chế theo tiêu chuẩn
            an toàn bảo mật (OWASP LLM01 - Prompt Injection). Vui lòng điều chỉnh
            lại câu hỏi.
        keywords: 'bỏ qua lệnh

          ignore instructions

          in ra tất cả

          hệ thống'
        outputs_config:
          enabled: true
          preset_response: ⚠️ Phản hồi chứa nội dung nhạy cảm đã bị chặn bởi hệ thống
            kiểm duyệt an toàn.
      enabled: true
      type: keywords
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''

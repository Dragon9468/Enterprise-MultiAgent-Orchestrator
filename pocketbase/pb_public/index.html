<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketBase Service | Enterprise AI Platform</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 2.5rem;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
      font-weight: 800;
    }
    p {
      color: #94a3b8;
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    a.btn {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      padding: 0.875rem 1.5rem;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      font-weight: 700;
      border-radius: 0.75rem;
      transition: background 0.2s;
    }
    a.btn:hover {
      background: #2563eb;
    }
  </style>
  <script>
    // Tự động chuyển hướng đến trang Admin Dashboard sau 2 giây nếu muốn
    // window.location.href = '/_/';
  </script>
</head>
<body>
  <div class="card">
    <div class="badge">● Online</div>
    <h1>PocketBase API Service</h1>
    <p>Dịch vụ Cơ sở dữ liệu & Xác thực của <strong>Enterprise AI Platform</strong> đang hoạt động bình thường.</p>
    <a href="/_/" class="btn">Mở Trang Quản Trị Admin Dashboard ( /_/ ) →</a>
  </div>
</body>
</html>

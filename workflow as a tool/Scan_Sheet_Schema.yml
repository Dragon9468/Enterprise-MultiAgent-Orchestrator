app:
  description: Công cụ quét dòng tiêu đề Header của Sheet được chọn để ánh xạ chữ cái cột (A, B, C...) và định vị chính xác tọa độ dải ô (Range) cần rút trích dữ liệu.
  icon: 📊
  icon_background: '#E6F4EA'
  icon_type: emoji
  mode: workflow
  name: Quét Cấu Trúc Bảng Tính (Schema Scanner)
  use_icon_as_answer_icon: false

          1. Đọc file phân quyền `Muc_Luc_Tai_Lieu.json` theo 3 biến (`role_level`,\
          \ `department`, `department_id`) để xác định danh sách các `folder_id` mục\
          \ tiêu và các `topics`.\n2. Vận hành băng chuyền cho từng thư mục:\n   -\
          \ Bước 1: Dùng tool `SearchFile_GGDrive` (Tìm Kiếm File Trên Google Drive)\
          \ để lấy `file_id`.\n   - Bước 2: Dùng tool `Get_RowColumn_GGSheet` (Quét\
          \ Cấu Trúc Bảng Tính - Schema Scanner) để lấy danh sách cột và sheet.\n\
          \   - Bước 3: Dùng tool `Get_Data_GGSheet` (Trích Xuất Dữ Liệu Google Sheets\

    metadata:
      description: Agent Truy xuất dữ liệu Google Drive & Sheets điều phối 3 Tool
        theo Skill và Ma trận Mục lục.
      icon: 🤖
      icon_background: '#D5D9EB'
      icon_type: emoji
      name: Agent Truy xuất GG Sheet + Doc
      role: Data Retrieval & Sheet Extraction Specialist
    omitted_assets: []
    schema_version: 1
    soul:
      app_features:
        file_upload:
          allowed_file_extensions:
          - JPG
          - JPEG
          - PNG
          - GIF
          - WEBP
          - SVG
          allowed_file_types:
          - document
          - image
          - audio
          - video
          allowed_file_upload_methods:
          - local_file
          - remote_url
          enabled: true
          image:
            enabled: true
          number_limits: 3
        opening_statement: null
        retriever_resource: null
        sensitive_word_avoidance: null
        speech_to_text: null
        suggested_questions: null
        suggested_questions_after_answer: null
        text_to_speech: null
      app_variables:
      - default: ''
        description: Mã nhân viên
        name: emp_id
        required: false
        type: string
        value_enum: []
      - default: '1'
        description: 'Cấp bậc người dùng (1: NV, 2: Chuyên viên, 3: Trưởng nhóm, 4: Trưởng phòng, 5: Ban Giám Đốc)'
        name: role_level
        required: false
        type: string
        value_enum: []
      - default: IBB
        description: Phòng ban (IBB, USER, INF, CSKH, QA, HR)
        name: department
        required: false
        type: string
        value_enum: []
      - default: '1'
        description: ID phòng ban / khu vực (1, 2, 3, ALL)
        name: department_id
        required: false
        type: string
        value_enum: []
      config_files:
      - file_kind: upload_file
        is_missing: true
        name: Muc_Luc_Tai_Lieu.json
      config_note: ''
      config_skills: []
      env:
        secret_refs: []
        variables:
        - name: ROOT_STORAGE_URL
          value: https://drive.google.com/drive/folders/YOUR_ROOT_STORAGE_FOLDER_ID
      files:
        files: []
        skills: []
      human:
        contacts: []
        tools: []
      knowledge:
        sets: []
      memory:
        artifacts: []
        budget: null
        scope: null
      misc_legacy: {}
      model:

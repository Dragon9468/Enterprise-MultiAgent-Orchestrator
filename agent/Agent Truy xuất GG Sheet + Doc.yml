app:
  description: Agent Chuyên trách Truy xuất Dữ liệu Google Sheets và Tài liệu Google
    Drive theo Ma trận Phân quyền 3 Biến (role_level, department, department_id) vận
    hành băng chuyền 3 Tool (Locate -> Scan -> Extract).
  icon: 🤖
  icon_background: '#D5D9EB'
  icon_type: emoji
  mode: agent
  name: Agent Truy xuất GG Sheet + Doc
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
dependencies:
- current_identifier: null
  type: marketplace
  value:
